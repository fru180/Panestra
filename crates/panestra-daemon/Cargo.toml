[package]
name = "panestra-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["macros", "ws"] }
base64 = "0.22.1"
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.5.60", features = ["derive"] }
futures-util = "0.3.32"
http = "1.4.0"
libc = "0.2.182"
parking_lot = "0.12.5"
portable-pty = "0.9.0"
rand = "0.10.0"
rmp-serde = "1.3.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.149"
semver = "1.0.27"
subtle = "2.6.1"
strip-ansi-escapes = "0.2.1"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
ureq = { version = "3.3.0", default-features = false, features = ["json"] }
url = "2.5.8"
uuid = { version = "1.21.0", features = ["serde", "v4"] }
vt100 = "0.16.2"
zstd = "0.13.3"


[dev-dependencies]
tempfile = "3.25.0"
tower = { version = "0.5.3", features = ["util"] }
