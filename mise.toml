[tools]
node = "24.18.0"
rust = { version = "1.97.1", profile = "minimal", components = "clippy,rustfmt" }

[env]
RUST_BACKTRACE = "1"

[tasks.install]
description = "Install JavaScript dependencies"
run = "pnpm install"

[tasks.dev]
description = "Run the web app and daemon in development mode"
run = "pnpm dev"

[tasks.check]
description = "Run format, lint, type, and Rust checks"
run = "pnpm check"

[tasks.test]
description = "Run all automated tests"
run = "pnpm test"
